# Fly.io — a API.
#
# O frontend não vive aqui: ele vai para a Vercel, e o Postgres para o Neon
# (ver docs/13-deploy.md). Este arquivo cobre só o serviço Python.
#
# `app` e `primary_region` são os dois valores que mudam por instalação. `gru`
# é São Paulo, escolhido para ficar perto do Neon em `sa-east-1` — a latência
# entre API e banco é o que mais aparece numa demonstração ao vivo, porque toda
# tela faz várias consultas.
app = "materialselect-ai"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile.api"

[deploy]
  # As migrações rodam aqui, num contêiner separado, ANTES da nova versão
  # receber tráfego — e se falharem, o deploy é abortado e a versão antiga
  # continua servindo. É o mesmo papel do serviço `migrate` no
  # docker-compose.yml, e a razão de o Dockerfile.api copiar `alembic/`.
  #
  # Um passo de release é o lugar certo para isso justamente porque roda uma
  # vez por deploy: migração no startup da aplicação executa uma vez por
  # máquina, e duas máquinas subindo juntas competem pela mesma tabela.
  release_command = "python -m alembic upgrade head"

[env]
  ENVIRONMENT = "production"
  PORT = "8080"
  # Sem AI_PROVIDER definido aqui: o padrão do código é `mock`, o único
  # determinístico (D-35). Ligar um provedor real é decisão de operação, feita
  # por `fly secrets set`, não algo que este arquivo decide por quem implanta.

[http_service]
  internal_port = 8080
  force_https = true

  # As duas linhas que decidem se a banca vê a ferramenta ou uma tela branca.
  #
  # O padrão do Fly é hibernar a máquina sem tráfego e acordá-la na próxima
  # requisição, o que custa alguns segundos — aceitável para um hobby, péssimo
  # no meio de uma apresentação, e pior ainda aqui porque a primeira coisa que
  # a aplicação faz é `/auth/me`: o avaliador olharia para "Verificando
  # sessão…" enquanto a máquina liga.
  #
  # Manter uma máquina sempre de pé custa mais do que zero. É uma escolha
  # consciente de trocar centavos por previsibilidade no dia que importa.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  # Quantas requisições o proxy do Fly entrega de uma vez a esta máquina
  # (D-231). Eram 40/60, e nenhuma máquina de 1 GB aguenta 60 telas pesadas
  # juntas: com o catálogo de 678 materiais, oito requisições simultâneas
  # levaram o processo a 1,6 GB na medição local. Acima de `hard_limit` o
  # proxy segura a requisição na fila em vez de entregá-la; abaixo dele, o
  # portão do app (HEAVY_REQUEST_CONCURRENCY, 2 por padrão) deixa só duas
  # pesadas rodarem juntas. Uma tela abre com até ~6 pedidos paralelos, e
  # 8 deixa uma tela inteira passar enquanto a próxima espera.
  [http_service.concurrency]
    type = "requests"
    soft_limit = 5
    hard_limit = 8

  # `/api/health` é público de propósito (fica fora do portão de assinatura,
  # ver app/main.py): é o que o balanceador consulta, e ele não tem sessão.
  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"

# 1 GB desde o D-231. Com 512 MB a máquina única foi morta por falta de
# memória (exit 137, quatro vezes em três minutos depois do deploy de
# 13/11/26): o processo Python, com o catálogo de 678 materiais carregado
# por requisição e algumas telas abertas ao mesmo tempo, passava do teto.
# Um worker só, de propósito: mais workers multiplicam a memória.
# Números medidos e o motivo em docs/13-deploy.md (§2, "Memória da VM").
[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
