[project]
name = "materialselect-api"
version = "0.1.0"
description = "MaterialSelect AI — deterministic backend for materials selection (Ashby methodology)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pint>=0.24",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.5",
    "black>=24.4",
]
# The AI layer is optional and so is its dependency: `mock` and `claude-cli`
# need nothing from here, and the deterministic product needs nothing at all.
# Only AI_PROVIDER=claude-api talks to the Anthropic SDK.
ai = [
    "anthropic>=0.69",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",   # line length handled by black/formatter tolerance
    "UP042",  # keep `str, Enum` (not StrEnum): stable .value serialization, no behavioral churn
]

[tool.ruff.lint.per-file-ignores]
# Depends()/File() in defaults is the idiomatic FastAPI dependency-injection
# pattern; B008 is a known false positive for routers.
"app/routers/*" = ["B008"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
addopts = "-q"
