# Integração contínua do MaterialSelect AI.
#
# O portão reproduz exatamente os comandos documentados no README e no
# CLAUDE.md, para que "passou na minha máquina" e "passou na CI" signifiquem a
# mesma coisa. Nenhum passo é informativo: se um falha, o merge não acontece.
#
# A alegação de reprodutibilidade do trabalho depende de os cálculos
# determinísticos serem verificados a cada mudança — é isso que esta pipeline
# protege.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Um push novo na mesma branch cancela a execução anterior: só o último commit
# interessa, e a fila não cresce.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Preparar Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Instalar dependências
        working-directory: apps/web
        run: npm ci

      - name: Build do frontend
        working-directory: apps/web
        env:
          # NEXT_PUBLIC_* é inlinado em tempo de build, não de execução — sem
          # isto aqui, "npm run start" mais abaixo serviria um bundle que
          # aponta para o padrão embutido no código, não para esta CI.
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Instalar dependências do backend
        working-directory: apps/api
        run: pip install -e ".[dev,knowledge]"

      - name: Subir API e banco para Lighthouse
        working-directory: apps/api
        env:
          DATABASE_URL: sqlite:///./lighthouse.db
          UPLOAD_DIR: ./var/uploads-lh
          CORS_ORIGINS: http://localhost:3000
          AI_PROVIDER: mock
          # e2e_server.py escuta em 8811 por padrão (a porta isolada da suíte
          # Playwright); o passo seguinte aponta o frontend para 8000, a porta
          # de dev normal — sem isto o Lighthouse bate numa porta vazia.
          E2E_API_PORT: "8000"
        run: |
          python scripts/e2e_server.py &
          sleep 5

      - name: Rodar Lighthouse CI
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run lighthouse

      - name: Publicar relatório Lighthouse
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: apps/web/.lighthouseci/
          retention-days: 7

  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # Sem fail-fast: se a 3.11 quebrar e a 3.12 não, queremos ver as duas.
      fail-fast: false
      matrix:
        # 3.11 é o piso declarado em pyproject.toml; 3.12 é o ambiente de
        # desenvolvimento. As duas precisam passar.
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Instalar dependências
        run: pip install -e ".[dev,knowledge]"

      - name: Lint (ruff)
        run: ruff check app

      - name: Formatação (black)
        run: black --check app

      - name: Testes
        run: pytest

      - name: Migrações aplicam e o seed roda
        # Os testes usam SQLite em memória com create_all, então nunca exercitam
        # o Alembic. Este passo garante que as migrações versionadas — a fonte de
        # verdade do schema — realmente aplicam do zero, e que o seed de dados
        # demonstrativos funciona sobre elas.
        env:
          DATABASE_URL: sqlite:///./ci-check.db
        run: |
          python -m alembic upgrade head
          python -m app.db.seed

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7

      - name: Preparar Node
        uses: actions/setup-node@v7
        with:
          # Node 20 saiu do suporte; 22 é a LTS ativa e é o que o Next 14 pede
          # como piso realista.
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Instalar dependências
        # `npm ci` respeita o lockfile e falha se ele estiver dessincronizado do
        # package.json — o que é a verificação que queremos.
        run: npm ci

      - name: Tipos (modo estrito)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm run test

      - name: Build de produção
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Instalar dependências do backend
        working-directory: apps/api
        run: pip install -e ".[dev,knowledge]"

      - name: Preparar Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Instalar dependências do frontend
        working-directory: apps/web
        run: npm ci

      - name: Instalar o Chromium do Playwright
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Rodar a suíte end-to-end
        working-directory: apps/web
        env:
          # `setup-python` já deixa o interpretador certo no PATH; sem venv
          # nesta pipeline, "python" resolve para ele diretamente.
          E2E_API_PYTHON: python
        run: npm run test:e2e

      - name: Publicar evidência da falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
