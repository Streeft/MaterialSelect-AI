# Integração contínua do MaterialSelect AI.
#
# O portão reproduz exatamente os comandos documentados no README e no
# CLAUDE.md, para que "passou na minha máquina" e "passou na CI" signifiquem a
# mesma coisa. Nenhum passo é informativo: se um falha, o merge não acontece.
#
# A alegação de reprodutibilidade do trabalho depende de os cálculos
# determinísticos serem verificados a cada mudança — é isso que esta pipeline
# protege.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Um push novo na mesma branch cancela a execução anterior: só o último commit
# interessa, e a fila não cresce.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Portas, token de sessão e variáveis são os mesmos de
  # `apps/web/e2e/playwright.config.ts`: o Lighthouse audita as mesmas rotas
  # autenticadas, e uma segunda convenção só criaria duas maneiras de a
  # sessão quebrar.
  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # `setup-python` precisa vir ANTES do `pip install`: ele troca o
      # interpretador ativo, e instalar antes deixa as dependências num Python
      # que não é o que vai rodar o servidor.
      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Instalar dependências do backend
        working-directory: apps/api
        run: pip install -e ".[dev]"

      - name: Preparar Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Instalar dependências do frontend
        working-directory: apps/web
        run: npm ci

      # `next start` exige um build de produção — e o `NEXT_PUBLIC_*` é
      # embutido no bundle aqui, não na hora de servir. Apontar a API só no
      # passo do Lighthouse chegaria tarde demais.
      - name: Build de produção
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8811
        run: npm run build

      - name: Subir API e banco para Lighthouse
        working-directory: apps/api
        env:
          DATABASE_URL: sqlite:///./lighthouse.db
          UPLOAD_DIR: ./var/uploads-lh
          CORS_ORIGINS: http://127.0.0.1:3000
          AI_PROVIDER: mock
          E2E_API_PORT: "8811"
          # A sessão fixa que o seed escreve (A5) só é criada com estas duas
          # variáveis. Sem elas as 11 rotas caem em /entrar e o Lighthouse
          # audita onze vezes a tela de login.
          ENVIRONMENT: development
          E2E_SESSION_TOKEN: e2e-fixed-session-token-nao-use-em-producao
        run: |
          python scripts/e2e_server.py &
          # Espera de prontidão, não `sleep` fixo: em segundo plano o passo
          # termina com sucesso mesmo se o servidor morreu, e o erro só
          # aparece passos adiante, disfarçado de falha do Lighthouse.
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8811/api/health > /dev/null; then
              echo "API pronta."
              exit 0
            fi
            sleep 1
          done
          echo "::error::A API não respondeu em /api/health depois de 60s."
          exit 1

      - name: Rodar Lighthouse CI
        working-directory: apps/web
        run: npm run lighthouse

      - name: Publicar relatório Lighthouse
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: apps/web/.lighthouseci/
          retention-days: 7

  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # Sem fail-fast: se a 3.11 quebrar e a 3.12 não, queremos ver as duas.
      fail-fast: false
      matrix:
        # 3.11 é o piso declarado em pyproject.toml; 3.12 é o ambiente de
        # desenvolvimento. As duas precisam passar.
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Instalar dependências
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check app

      - name: Formatação (black)
        run: black --check app

      - name: Testes
        run: pytest

      - name: Migrações aplicam e o seed roda
        # Os testes usam SQLite em memória com create_all, então nunca exercitam
        # o Alembic. Este passo garante que as migrações versionadas — a fonte de
        # verdade do schema — realmente aplicam do zero, e que o seed de dados
        # demonstrativos funciona sobre elas.
        env:
          DATABASE_URL: sqlite:///./ci-check.db
        run: |
          python -m alembic upgrade head
          python -m app.db.seed

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7

      - name: Preparar Node
        uses: actions/setup-node@v7
        with:
          # Node 20 saiu do suporte; 22 é a LTS ativa e é o que o Next 14 pede
          # como piso realista.
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Instalar dependências
        # `npm ci` respeita o lockfile e falha se ele estiver dessincronizado do
        # package.json — o que é a verificação que queremos.
        run: npm ci

      - name: Tipos (modo estrito)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm run test

      - name: Build de produção
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Instalar dependências do backend
        working-directory: apps/api
        run: pip install -e ".[dev]"

      - name: Preparar Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Instalar dependências do frontend
        working-directory: apps/web
        run: npm ci

      - name: Instalar o Chromium do Playwright
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Rodar a suíte end-to-end
        working-directory: apps/web
        env:
          # `setup-python` já deixa o interpretador certo no PATH; sem venv
          # nesta pipeline, "python" resolve para ele diretamente.
          E2E_API_PYTHON: python
        run: npm run test:e2e

      - name: Publicar evidência da falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
