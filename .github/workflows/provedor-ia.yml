# Troca a IA da API em produção (D-93), disparado à mão — sem terminal.
#
#   gemini  a IA oficial do projeto: o plano GRATUITO do Google AI Studio, pelo
#           endpoint compatível com OpenAI. A mesma chave serve a busca
#           semântica (embeddings), então basta um segredo. Os embeddings
#           saem com 768 dimensões (D-101), a identidade com que o workflow
#           "Base de conhecimento (Cérebro)" grava os vetores.
#   groq    o provedor anterior, plano gratuito da Groq. Sem embeddings.
#   mock    o simulado: determinístico, sem rede, sem chave. É o padrão do
#           código e o que os testes exercitam.
#
# **Grátis de propósito.** A chave do Gemini é criada no Google AI Studio SEM
# faturamento ligado ao projeto do Google Cloud — é isso que a mantém gratuita.
# Ligar o faturamento (inclusive com o crédito da assinatura) muda o plano e
# passa a cobrar. No plano gratuito o Google pode usar o conteúdo enviado para
# melhorar os modelos; a interface avisa os alunos disso.
#
# O que muda são segredos do app no Fly. Não há PR nem deploy de código: gravar
# os segredos reinicia as máquinas com os valores novos.
#
# **O job só fica verde depois de ler o provedor e o modelo novos em
# `/api/health`** — a mesma regra do `modo-acesso.yml`: um segredo gravado numa
# API anterior ao D-93 seria ignorado em silêncio e o job passaria verde. Se
# falhar com "provedor ausente", dispare antes o "Deploy da API".
#
# Pré-requisitos (Settings → Secrets and variables → Actions):
#   FLY_API_TOKEN   o mesmo do deploy
#   GEMINI_API_KEY  para `gemini` (Google AI Studio → Get API key)
#   GROQ_API_KEY    para `groq`
#
# **Só `workflow_dispatch`**, pela mesma razão do `deploy-api.yml`.
name: Provedor de IA

on:
  workflow_dispatch:
    inputs:
      provedor:
        description: "gemini = IA oficial (grátis); groq = anterior; mock = simulado, sem rede"
        required: true
        type: choice
        options:
          - gemini
          - groq
          - mock
      modelo_gemini:
        description: "Modelo do Gemini (só vale para gemini). Os -latest acompanham o Flash vigente; o lite aguenta mais pedidos por dia."
        required: false
        type: choice
        default: gemini-flash-latest
        options:
          - gemini-flash-latest
          - gemini-flash-lite-latest
          - gemini-3.5-flash
      modelo_personalizado:
        description: "Opcional: outro modelo do Gemini (ex.: gemini-3.5-flash-lite). Se preenchido, vale no lugar do de cima."
        required: false
        type: string
        default: ""
      modo_json:
        description: "Saída estruturada. Troque para object só se a IA disser que o servidor recusou response_format/json_schema."
        required: false
        type: choice
        default: schema
        options:
          - schema
          - object

# Divide o grupo com o deploy e com o modo de acesso: todos reiniciam as mesmas
# máquinas.
concurrency:
  group: deploy-api
  cancel-in-progress: false

# A identidade dos embeddings que a API usa para embedar a pergunta. A fonte é
# o `env:` de `conhecimento.yml`, que grava os vetores do Cérebro; se os dois
# divergirem, a busca semântica ignora todo vetor gravado — e a ação `status`
# daquele workflow mostra isso na linha "API vs vetores". Mude os dois juntos.
env:
  EMBEDDING_MODELO: gemini-embedding-001
  EMBEDDING_DIMENSOES: "768"

jobs:
  provedor:
    name: Provedor de IA
    runs-on: ubuntu-latest
    steps:
      # Traz o fly.toml, de onde o flyctl lê o nome do app.
      - uses: actions/checkout@v7

      - name: Preparar flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      # Antes de tocar no Fly, a própria chave pergunta ao Google se o modelo
      # responde. Um modelo aposentado ou restrito (o Gemini 2.5, para uma
      # chave nova, em 2026) responde 404 com a URL certa — e sem esta
      # conferência o job ficava verde e o caderno mostrava o erro.
      - name: Conferir o modelo com a chave
        if: inputs.provedor == 'gemini'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODELO_GEMINI: ${{ inputs.modelo_gemini }}
          MODELO_PERSONALIZADO: ${{ inputs.modelo_personalizado }}
        run: |
          set -euo pipefail
          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "::error::Crie o secret GEMINI_API_KEY (Settings → Secrets and variables → Actions → New repository secret; a chave vem do Google AI Studio, sem faturamento)."
            exit 1
          fi
          modelo="${MODELO_PERSONALIZADO:-}"
          if [ -z "$modelo" ]; then
            modelo="$MODELO_GEMINI"
          fi
          if ! printf '%s' "$modelo" | grep -Eq '^[a-z0-9][a-z0-9.-]{0,79}$'; then
            echo "::error::Nome de modelo inválido: use só letras minúsculas, números, ponto e hífen."
            exit 1
          fi
          base=https://generativelanguage.googleapis.com/v1beta/openai
          motivo() {
            jq -r 'if type == "array" then .[0].error.message else .error.message end // "sem detalhe"' "$1" 2>/dev/null || head -c 300 "$1"
          }

          corpo=$(mktemp)
          status=$(curl -sS --max-time 60 -o "$corpo" -w '%{http_code}' \
            -H "Authorization: Bearer $GEMINI_API_KEY" -H "Content-Type: application/json" \
            -d "{\"model\": \"$modelo\", \"messages\": [{\"role\": \"user\", \"content\": \"Responda apenas: ok\"}], \"max_tokens\": 16}" \
            "$base/chat/completions" || true)
          if [ "$status" != "200" ]; then
            echo "::error::O Gemini recusou o modelo '$modelo' (HTTP $status): $(motivo "$corpo")"
            lista=$(mktemp)
            if curl -sS --max-time 30 -o "$lista" -H "Authorization: Bearer $GEMINI_API_KEY" "$base/models"; then
              echo "Modelos que esta chave enxerga (escolha um no campo 'modelo_personalizado'):"
              jq -r '.data[]?.id' "$lista" | sed 's#^models/##' | grep -Ei 'flash|embedding' | sort || true
            fi
            exit 1
          fi
          echo "O modelo '$modelo' respondeu com esta chave."
          echo "MODELO=$modelo" >> "$GITHUB_ENV"

          # Os embeddings são opcionais (D-47): sem eles a busca cai para a
          # léxica. Se o modelo de embedding não responder — ou ignorar o
          # pedido de dimensões e devolver outro tamanho —, o job avisa e não
          # o grava, em vez de falhar a troca inteira.
          status=$(curl -sS --max-time 60 -o "$corpo" -w '%{http_code}' \
            -H "Authorization: Bearer $GEMINI_API_KEY" -H "Content-Type: application/json" \
            -d "{\"model\": \"$EMBEDDING_MODELO\", \"input\": [\"teste\"], \"dimensions\": $EMBEDDING_DIMENSOES}" \
            "$base/embeddings" || true)
          tamanho=""
          if [ "$status" = "200" ]; then
            tamanho=$(jq -r '.data[0].embedding | length' "$corpo" 2>/dev/null || true)
          fi
          if [ "$status" = "200" ] && [ "$tamanho" = "$EMBEDDING_DIMENSOES" ]; then
            echo "O $EMBEDDING_MODELO respondeu com $tamanho dimensões."
            echo "EMBEDDING=$EMBEDDING_MODELO" >> "$GITHUB_ENV"
          elif [ "$status" = "200" ]; then
            echo "::warning::$EMBEDDING_MODELO devolveu vetores de ${tamanho:-?} dimensões, não $EMBEDDING_DIMENSOES. Os embeddings ficam desligados: a busca segue só léxica."
            echo "EMBEDDING=" >> "$GITHUB_ENV"
          else
            echo "::warning::$EMBEDDING_MODELO não respondeu (HTTP $status): $(motivo "$corpo"). A busca segue só léxica."
            echo "EMBEDDING=" >> "$GITHUB_ENV"
          fi

      # As escolhas chegam por variável de ambiente, nunca interpoladas no
      # `run:`, e são traduzidas por tabelas fechadas: nenhum texto digitado
      # vira valor de segredo. As chaves nunca são impressas.
      - name: Gravar os segredos da IA
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PROVEDOR: ${{ inputs.provedor }}
          MODO_JSON: ${{ inputs.modo_json }}
        run: |
          set -euo pipefail
          if [ -z "${FLY_API_TOKEN:-}" ]; then
            echo "::error::O secret FLY_API_TOKEN não está definido."
            exit 1
          fi
          case "$MODO_JSON" in
            schema|object) ;;
            *) echo "::error::Modo JSON desconhecido: $MODO_JSON"; exit 1 ;;
          esac
          # Sem embeddings, os dois segredos saem juntos: um modelo sem a
          # dimensão (ou o contrário) embedaria a pergunta noutro tamanho.
          desligar_embeddings() {
            echo "ESPERADO_EMBEDDING=null" >> "$GITHUB_ENV"
            echo "ESPERADO_DIMENSOES=null" >> "$GITHUB_ENV"
            flyctl secrets unset KNOWLEDGE_EMBEDDING_MODEL > /dev/null 2>&1 || true
            flyctl secrets unset KNOWLEDGE_EMBEDDING_DIMENSIONS > /dev/null 2>&1 || true
          }
          case "$PROVEDOR" in
            gemini)
              if [ -z "${GEMINI_API_KEY:-}" ]; then
                echo "::error::Crie o secret GEMINI_API_KEY (Google AI Studio → Get API key, sem faturamento)."
                exit 1
              fi
              # MODELO e EMBEDDING vêm do passo de conferência, que já validou
              # o nome e ouviu a resposta do Google com esta chave.
              echo "ESPERADO_PROVEDOR=openai-compat" >> "$GITHUB_ENV"
              echo "ESPERADO_MODELO=$MODELO" >> "$GITHUB_ENV"
              segredos=(
                AI_PROVIDER=openai-compat
                AI_BASE_URL=https://generativelanguage.googleapis.com/v1beta/openai
                AI_MODEL="$MODELO"
                AI_JSON_MODE="$MODO_JSON"
                AI_API_KEY="$GEMINI_API_KEY"
              )
              # Num `set` só, para as máquinas reiniciarem uma vez.
              if [ -n "${EMBEDDING:-}" ]; then
                segredos+=(
                  KNOWLEDGE_EMBEDDING_MODEL="$EMBEDDING"
                  KNOWLEDGE_EMBEDDING_DIMENSIONS="$EMBEDDING_DIMENSOES"
                )
                echo "ESPERADO_EMBEDDING=$EMBEDDING" >> "$GITHUB_ENV"
                echo "ESPERADO_DIMENSOES=$EMBEDDING_DIMENSOES" >> "$GITHUB_ENV"
              fi
              flyctl secrets set "${segredos[@]}" > /dev/null
              if [ -z "${EMBEDDING:-}" ]; then
                desligar_embeddings
              fi
              ;;
            groq)
              if [ -z "${GROQ_API_KEY:-}" ]; then
                echo "::error::Crie o secret GROQ_API_KEY."
                exit 1
              fi
              echo "ESPERADO_PROVEDOR=openai-compat" >> "$GITHUB_ENV"
              echo "ESPERADO_MODELO=openai/gpt-oss-20b" >> "$GITHUB_ENV"
              flyctl secrets set \
                AI_PROVIDER=openai-compat \
                AI_BASE_URL=https://api.groq.com/openai/v1 \
                AI_MODEL=openai/gpt-oss-20b \
                AI_JSON_MODE="$MODO_JSON" \
                AI_API_KEY="$GROQ_API_KEY" \
                > /dev/null
              # A Groq não serve embeddings: sem modelo, a busca cai para a
              # léxica (D-47), em vez de chamar um /embeddings que não existe.
              desligar_embeddings
              ;;
            mock)
              echo "ESPERADO_PROVEDOR=mock" >> "$GITHUB_ENV"
              echo "ESPERADO_MODELO=null" >> "$GITHUB_ENV"
              flyctl secrets set AI_PROVIDER=mock > /dev/null
              # O simulado não tem rede: nenhum embedding fica ligado.
              desligar_embeddings
              ;;
            *) echo "::error::Provedor desconhecido: $PROVEDOR"; exit 1 ;;
          esac

      - name: Confirmar o provedor na API publicada
        run: |
          set -euo pipefail
          app="$(grep -E '^app *= *"' fly.toml | sed -E 's/^app *= *"([^"]+)".*/\1/')"
          url="https://${app}.fly.dev/api/health"
          for tentativa in $(seq 1 36); do
            corpo="$(curl -fsS --max-time 10 "$url" || echo '{}')"
            provedor="$(echo "$corpo" | jq -r '.ai_provider // "ausente"')"
            modelo="$(echo "$corpo" | jq -r '.ai_model // "null"')"
            # D-101: a identidade dos embeddings também tem de ter chegado.
            # "ausente" = uma API anterior ao campo, que ignoraria a dimensão.
            embedding="$(echo "$corpo" | jq -r 'if has("knowledge_embedding_model") then (.knowledge_embedding_model // "null") else "ausente" end')"
            dimensoes="$(echo "$corpo" | jq -r '.knowledge_embedding_dimensions // "null"')"
            echo "Tentativa $tentativa: provedor=$provedor modelo=$modelo embedding=$embedding dimensoes=$dimensoes"
            if [ "$provedor" = "$ESPERADO_PROVEDOR" ] && [ "$modelo" = "$ESPERADO_MODELO" ] \
              && [ "$embedding" = "$ESPERADO_EMBEDDING" ] && [ "$dimensoes" = "$ESPERADO_DIMENSOES" ]; then
              echo "A API publicada usa $provedor ($modelo); embeddings: $embedding ($dimensoes dimensões)."
              exit 0
            fi
            sleep 5
          done
          if [ "$provedor" = "ausente" ]; then
            echo "::error::A API publicada não informa o provedor: ela é anterior ao D-93. Dispare 'Deploy da API' e rode este workflow de novo."
          elif [ "$embedding" = "ausente" ]; then
            echo "::error::A API publicada não informa o modelo de embedding: ela é anterior ao D-101. Dispare 'Deploy da API' e rode este workflow de novo."
          else
            echo "::error::A API publicada continua em $provedor ($modelo), embeddings $embedding ($dimensoes)."
          fi
          exit 1
