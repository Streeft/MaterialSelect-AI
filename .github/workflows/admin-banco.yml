# Operações administrativas contra o banco de produção, disparadas à mão.
#
# Operações que `docs/13-deploy.md` manda fazer contra o banco sem depender de
# terminal local: migrações, seeds explícitos, cutover/import do catálogo
# oficial, manutenção do Cérebro e concessão/revogação de acesso. Todas
# dependem só de alcançar o
# Postgres — não passam pelo Fly —, e o runner do GitHub alcança.
#
# **Só `workflow_dispatch`.** Num repositório público isso importa: o disparo
# manual exige permissão de escrita, e nenhum gatilho aqui responde a evento de
# fork, então `DATABASE_URL` nunca é exposto a código de terceiro. Pelo mesmo
# motivo as entradas do usuário chegam ao shell por variável de ambiente e não
# por interpolação `${{ }}` dentro do `run:` — interpolar montaria o comando com
# o texto digitado dentro dele.
#
# **Não entra em `scripts/protect-main.ps1`** — ver a mesma nota em
# `deploy-api.yml`.
#
# Pré-requisito: o secret `DATABASE_URL` em Settings → Secrets and variables →
# Actions, com o esquema `postgresql+psycopg://` e o host **sem** `-pooler`
# (docs/13-deploy.md §1).
name: Administração do banco

on:
  workflow_dispatch:
    inputs:
      acao:
        description: "O que executar"
        required: true
        type: choice
        options:
          - migrar
          - semear_referencia
          - semear_demo
          - excluir_demo
          - catalogo_oficial_validar
          - catalogo_oficial_importar
          - conhecimento_simular_remocao
          - conhecimento_remover
          - conhecimento_indexar_links
          - conceder
          - revogar
      email:
        description: "E-mail da conta revisora no import oficial; lista também aceita em conceder/revogar"
        required: false
        type: string

# Duas execuções ao mesmo tempo disputariam as mesmas tabelas.
concurrency:
  group: admin-banco
  cancel-in-progress: false

jobs:
  executar:
    name: ${{ inputs.acao }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Os mesmos extras que o Dockerfile.api instala, para que o que roda aqui
      # seja o que roda em produção.
      - name: Instalar dependências
        run: pip install -e ".[postgres,billing]"

      - name: Executar
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # `seed_e2e_session` só grava a sessão fixa do Playwright quando
          # ENVIRONMENT=development; declarar `production` fecha essa porta aqui
          # de forma explícita, em vez de depender do padrão do config.
          ENVIRONMENT: production
          ACAO: ${{ inputs.acao }}
          EMAIL: ${{ inputs.email }}
          OFFICIAL_CATALOG_BUNDLE_URL: ${{ secrets.OFFICIAL_CATALOG_BUNDLE_URL }}
        run: |
          set -euo pipefail

          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::O secret DATABASE_URL não está definido."
            exit 1
          fi
          case "$DATABASE_URL" in
            postgresql+psycopg://*) ;;
            *)
              echo "::error::DATABASE_URL precisa começar com 'postgresql+psycopg://' — sem isso o SQLAlchemy procura o psycopg2, que não está instalado."
              exit 1
              ;;
          esac

          exigir_email() {
            if [ -z "${EMAIL:-}" ]; then
              echo "::error::A ação '$ACAO' exige o campo E-mail."
              exit 1
            fi
          }

          baixar_catalogo_oficial() {
            if [ -z "${OFFICIAL_CATALOG_BUNDLE_URL:-}" ]; then
              echo "::error::O secret OFFICIAL_CATALOG_BUNDLE_URL não está definido."
              exit 1
            fi
            BUNDLE="$RUNNER_TEMP/materialselect-official-catalog.zip"
            curl --fail --silent --show-error --location \
              --output "$BUNDLE" "$OFFICIAL_CATALOG_BUNDLE_URL"
          }

          case "$ACAO" in
            migrar)
              python -m alembic upgrade head
              ;;
            semear_referencia)
              # Caminho seguro de produção depois do catálogo oficial: garante
              # apenas taxonomias, definições e catálogos reais reutilizáveis.
              # Nunca recria material/processo/modal fictício.
              python -m alembic upgrade head
              python -m app.db.seed_reference
              ;;
            semear_demo)
              # Exclusivo para desenvolvimento/demonstração. Esta ação recria
              # deliberadamente o catálogo fictício e NÃO deve ser usada depois
              # do cutover da base oficial.
              python -m alembic upgrade head
              python -m app.db.seed
              python -m app.db.seed_extended
              ;;
            excluir_demo)
              # Irreversível: apaga somente linhas is_demo=True em todos os
              # modelos marcáveis (material, processo, modal, química, índice
              # e fonte), recusando apagar uma fonte demo ainda citada por
              # registro real. Rode só no cutover; ver docs/15 e docs/18.
              python -m app.db.clear_demo
              ;;
            catalogo_oficial_validar)
              baixar_catalogo_oficial
              python -m app.catalog.official_import --bundle "$BUNDLE"
              ;;
            catalogo_oficial_importar)
              exigir_email
              baixar_catalogo_oficial
              python -m app.catalog.official_import \
                --bundle "$BUNDLE" \
                --reviewer-email "$EMAIL" \
                --commit
              ;;
            conhecimento_simular_remocao)
              # Só lê: lista cada documento do Cérebro que casa com
              # Cérebro/removidos.txt, com trechos e embeddings, e os totais.
              # Rode antes de `conhecimento_remover` e confira o log (D-100).
              # `--redact`: o log do Actions é público, e um caminho gravado
              # pode trazer nome de aluno. Sai a pasta e o início do sha256 de
              # cada documento; contagens, histograma e totais ficam.
              python -m app.knowledge.prune --list "$GITHUB_WORKSPACE/Cérebro/removidos.txt" --redact
              ;;
            conhecimento_remover)
              # Irreversível: apaga do banco, numa transação, os documentos da
              # lista de remoção e os trechos e embeddings deles. A ingestão só
              # acrescenta; tirar o arquivo do repositório não tira o texto do
              # RAG — isto tira. O log imprime os totais apagados (D-71, D-100).
              # `--redact` pela mesma razão da simulação.
              python -m app.knowledge.prune --list "$GITHUB_WORKSPACE/Cérebro/removidos.txt" --apply --redact
              ;;
            conhecimento_indexar_links)
              # Ingesta Links.md de Cérebro/Links.md no RAG de produção (Neon).
              # Como o repositório é clonado pelo Actions e Links.md é versionado,
              # não depende de LFS nem dos arquivos grandes de KNOWLEDGE_DIR.
              # Só o texto (`--no-embed`), sem chave de IA no ambiente: os vetores
              # têm uma identidade só, gravada pelo `conhecimento.yml` (D-101),
              # que é também onde `ingerir` com `arquivos` faz o mesmo para
              # qualquer arquivo do Cérebro.
              KNOWLEDGE_DIR="$GITHUB_WORKSPACE/Cérebro" python -m app.knowledge.ingest --no-embed --file=Links.md
              ;;
            conceder)
              exigir_email
              python -m app.admin.grant_subscription --email "$EMAIL"
              ;;
            revogar)
              exigir_email
              python -m app.admin.grant_subscription --email "$EMAIL" --revoke
              ;;
            *)
              echo "::error::Ação desconhecida: $ACAO"
              exit 1
              ;;
          esac
