# Ambiente de produção em uma máquina só, e a forma mais fiel de reproduzir
# localmente o que roda hospedado: PostgreSQL + API + Web.
#
# O deploy real (ver docs/13-deploy.md) separa as três peças em provedores
# diferentes, mas este compose continua útil para exercitar as imagens e o
# caminho de migração sem depender de nenhuma conta.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: materialselect
      POSTGRES_PASSWORD: materialselect
      POSTGRES_DB: materialselect
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U materialselect"]
      interval: 5s
      timeout: 5s
      retries: 10

  # As migrações rodam como passo próprio, antes da API subir — o mesmo papel
  # que o `release_command` do fly.toml cumpre no ambiente hospedado. Sem isto o
  # banco fica vazio e a API sobe respondendo erro em toda rota.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgresql+psycopg://materialselect:materialselect@db:5432/materialselect
    depends_on:
      db:
        condition: service_healthy
    command: python -m alembic upgrade head

  api:
    build:
      # Contexto na raiz: o Dockerfile.api instala a partir de
      # apps/api/pyproject.toml, a fonte de verdade das dependências.
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgresql+psycopg://materialselect:materialselect@db:5432/materialselect
      CORS_ORIGINS: http://localhost:3000
      ENVIRONMENT: production
      # Em HTTP local o cookie de sessão precisa ser explicitamente inseguro;
      # o padrão é `true` (só HTTPS), que é o certo em produção de verdade.
      SESSION_COOKIE_SECURE: "false"
      PORT: "8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      # ARG, não `environment`: `NEXT_PUBLIC_*` é substituído durante o build e
      # não lido em runtime. Ver o comentário no Dockerfile.web.
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  db_data:
